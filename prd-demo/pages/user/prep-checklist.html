<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../assets/css/common.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* P15 전용 — 공통 크롬(.m-*)은 common.css 그대로 쓰고 여기서 재정의하지 않는다 */
    .tab-panel[hidden] { display: none; }
    /* 두 탭 균등 폭 + 스크롤 시 상단 고정 */
    .prep-tabs { position: sticky; top: 0; z-index: 2; padding: 0 var(--space-2); background: var(--color-bg); }
    .prep-tabs .tab { flex: 1; }

    /* 진행 상황 카드 — 제목·수치 한 줄, 설명은 아래 전체 폭 */
    .progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
    .progress-count { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* 체크 항목 카드 — 체크박스 · 제목(가운데) · 우측 액션 한 줄, 메모는 제목 열에 맞춰 들여쓰기 */
    .chk-card { padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); }
    .chk-card + .chk-card { margin-top: var(--space-2); }
    .chk-card.is-done { background: var(--theme-accent-soft); box-shadow: none; }
    .chk-row { display: flex; align-items: center; gap: var(--space-2); min-height: 48px; }
    .chk-row .check { flex: 1; min-width: 0; }
    .chk-row .check .t-strong { min-width: 0; line-height: 1.45; }
    .chk-row > .btn { margin-right: var(--space-2); }
    .chk-row .memo-btn { color: var(--color-text-sub); }
    .card-theme .progress { background: var(--color-surface); }
    .chk-card .check input:checked + .box + .t-strong { text-decoration: line-through; color: var(--color-text-sub); }
    .memo-preview, .memo-edit { margin-left: 36px; margin-right: var(--space-2); }
    .memo-preview { white-space: pre-line; margin-top: -4px; padding-bottom: var(--space-2); }
    .memo-preview:empty { display: none; }
    .memo-edit { padding-bottom: var(--space-2); }
    .memo-edit textarea { min-height: 84px; background: var(--color-surface); }
    .chk-card:not(.is-done) .memo-edit textarea { background: var(--color-surface-soft); }
    .memo-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

    .planner-field.field { margin-bottom: var(--space-5); }
    .planner-field.field:last-child { margin-bottom: 0; }
    .planner-actions { display: flex; flex-direction: column; align-items: stretch; gap: var(--space-3); }
    .saved-mark { display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--color-text-sub); font-size: var(--fs-caption); line-height: var(--lh-caption); }
    .saved-mark { order: 2; }
    .saved-mark[hidden] { display: none; }
  </style>
</head>

  <script>
    lucide.createIcons();
    try { var fs = localStorage.getItem('rd-font-scale'); if (fs === 'lg' || fs === 'xl') document.querySelector('.m-screen').setAttribute('data-font-scale', fs); } catch (e) {}

    var toastTimer;
    function showToast(msg) {
      var t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3000);
    }

    // 탭 전환 — 체크리스트 / 마지막 날 플래너 (플래너는 강제 진입 없이 탭 클릭으로만 진입)
    var tabs = document.querySelectorAll('.tab[data-tab]');
    var panels = document.querySelectorAll('.tab-panel[data-panel]');
    tabs.forEach(function (btn) {
      btn.addEventListener('click', function () {
        tabs.forEach(function (b) { b.classList.toggle('active', b === btn); });
        panels.forEach(function (p) { p.hidden = p.dataset.panel !== btn.dataset.tab; });
        document.querySelector('.m-content').scrollTop = 0;
      });
    });

    // 체크리스트 — 완료 토글 + 진행률 갱신
    var items = document.querySelectorAll('[data-chk-item]');
    var progressCount = document.getElementById('progressCount');
    var progressBar = document.getElementById('progressBar');

    function updateProgress() {
      var total = items.length;
      var done = document.querySelectorAll('[data-chk-item] input[type="checkbox"]:checked').length;
      progressCount.textContent = done + ' / ' + total;
      progressBar.style.width = Math.round((done / total) * 100) + '%';
    }

    items.forEach(function (card) {
      var checkbox = card.querySelector('input[type="checkbox"]');
      checkbox.addEventListener('change', function () {
        card.classList.toggle('is-done', checkbox.checked);
        updateProgress();
        var title = card.querySelector('.t-strong').textContent;
        showToast(checkbox.checked ? '"' + title + '" 완료로 표시했어요' : '완료 표시를 취소했어요');
      });

      var memoBtn = card.querySelector('.memo-btn');
      var memoEdit = card.querySelector('.memo-edit');
      if (memoBtn && memoEdit) {
        memoBtn.addEventListener('click', function () {
          memoEdit.hidden = !memoEdit.hidden;
          if (!memoEdit.hidden) { memoEdit.querySelector('textarea').focus(); }
        });
      }

      var saveBtn = card.querySelector('.memo-save');
      if (saveBtn) {
        saveBtn.addEventListener('click', function () {
          var text = memoEdit.querySelector('textarea').value.trim();
          var preview = card.querySelector('.memo-preview');
          preview.textContent = text ? '메모: ' + text : '';
          memoEdit.hidden = true;
          showToast('메모를 저장했어요');
        });
      }
    });

    updateProgress();

    // 마지막 날 플래너 — 저장 (자동·강제 이동 없음, 같은 화면에 머무름)
    document.getElementById('plannerSaveBtn').addEventListener('click', function () {
      showToast('마지막 날 플래너를 저장했어요');
      var mark = document.getElementById('plannerSaved');
      mark.hidden = false;
      lucide.createIcons();
      clearTimeout(mark._t);
      mark._t = setTimeout(function () { mark.hidden = true; }, 2600);
    });
  </script>
